# ============================================================
# Nginx 反向代理配置 — 高校教师电子名片系统
# ============================================================
# 部署位置: deploy/nginx.conf (docker-compose 自动挂载)
#           或 /etc/nginx/conf.d/gxjs.conf (独立部署)
#
# WebSocket: 不需要（系统未使用 WebSocket）
# ============================================================

upstream springboot {
    server app:8080;
    # 独立部署时改为: server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name card.univ.edu;
    # 独立部署时可改为 _ 或实际域名

    # 上传文件大小限制（与 Spring multipart 配置对齐）
    client_max_body_size 1000M;

    # 连接超时（大文件上传需要较长超时）
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ---- 上传文件：Nginx 直接提供（性能最优） ----
    location /gaoxiaojiaoshidianzimingpian/upload/ {
        alias /data/uploads/;

        # 先查文件系统，找不到则回退到 Spring Boot（classpath 模板文件）
        try_files $uri @springboot;

        # 静态资源缓存
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- 前端静态资源缓存 ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://springboot;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- 所有请求代理到 Spring Boot ----
    location /gaoxiaojiaoshidianzimingpian/ {
        proxy_pass http://springboot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 文件上传需要较大 buffer
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---- Spring Boot 回退（upload 目录 classpath 文件） ----
    # try_files 的 @named location
    # 注意：上面的 location 块中的 try_files 会跳到这里

    # 根路径重定向
    location = / {
        return 302 /gaoxiaojiaoshidianzimingpian/front/front/index.html;
    }

    # 健康检查
    location /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
        access_log off;
    }
}

