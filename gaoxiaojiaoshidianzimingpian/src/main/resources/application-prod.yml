        url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:gaoxiaojiaoshidianzimingpian}?useUnicode=true&characterEncoding=utf-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8
