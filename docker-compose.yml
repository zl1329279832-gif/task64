version: '3.8'

services:
  # ---- MySQL 8 ----
  mysql:
    image: mysql:8.0
    container_name: gxjs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-gaoxiaojiaoshidianzimingpian}
      MYSQL_USER: ${DB_USER:-gxjs_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"  # 生产环境建议去掉此端口映射
    volumes:
      - mysql-data:/var/lib/mysql
      - ./gaoxiaojiaoshidianzimingpian/sql:/docker-entrypoint-initdb.d:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- Spring Boot App ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gxjs-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-gaoxiaojiaoshidianzimingpian}
      DB_USER: ${DB_USER:-gxjs_user}
      DB_PASSWORD: ${DB_PASSWORD}
      UPLOAD_BASE_PATH: /data/uploads
    volumes:
      - upload-data:/data/uploads
    expose:
      - "8080"

  # ---- Nginx Reverse Proxy ----
  nginx:
    image: nginx:1.24-alpine
    container_name: gxjs-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - upload-data:/data/uploads:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/gaoxiaojiaoshidianzimingpian/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql-data:
    driver: local
  upload-data:
    driver: local
